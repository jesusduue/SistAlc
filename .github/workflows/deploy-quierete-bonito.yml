name: Deploy Quierete Bonito to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'quierete-bonito/**'
      - '.github/workflows/deploy-quierete-bonito.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./quierete-bonito

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
